      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7054
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.rsu1.tetaguard.net:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.rsu3.tetaguard.net:7053
      CORE_PEER_LOCALMSPID: TetagaurdMSP
