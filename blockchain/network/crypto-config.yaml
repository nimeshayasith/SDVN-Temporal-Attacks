# crypto-config.yaml — MSP certificate configuration for TETA-Guard
#
# One orderer org + one peer org containing all 5 RSU peers.
# Matches the peer hostnames in submit_alerts.py:
#   peer0.rsu1.tetaguard.net .. peer0.rsu5.tetaguard.net
#   orderer.tetaguard.net
#
# Generate crypto material:
#   cryptogen generate --config=./crypto-config.yaml --output=./crypto-config

OrdererOrgs:
  - Name: OrdererOrg
    Domain: orderer.tetaguard.net
    EnableNodeOUs: true
    Specs:
      - Hostname: orderer
        CommonName: orderer.tetaguard.net

PeerOrgs:
  - Name: TetagaurdOrg
    Domain: tetaguard.net
    EnableNodeOUs: true
    CA:
      Hostname: ca
    Template:
      Count: 0  # peers listed explicitly below
    Specs:
      - Hostname: peer0.rsu1
        CommonName: peer0.rsu1.tetaguard.net
      - Hostname: peer0.rsu2
        CommonName: peer0.rsu2.tetaguard.net
      - Hostname: peer0.rsu3
        CommonName: peer0.rsu3.tetaguard.net
      - Hostname: peer0.rsu4
        CommonName: peer0.rsu4.tetaguard.net
      - Hostname: peer0.rsu5
        CommonName: peer0.rsu5.tetaguard.net
    Users:
      Count: 1  # Admin user
