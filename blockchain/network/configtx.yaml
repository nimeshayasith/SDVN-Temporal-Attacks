# configtx.yaml — Fabric channel and endorsement policy for TETA-Guard
#
# PBFT-equivalent endorsement: MAJORITY of TetaGuardOrg RSU peers must endorse.
# For n=5 peers this requires 3 endorsements, tolerating 1 Byzantine peer
# (⌊(5-1)/3⌋ = 1) which satisfies the paper's PBFT requirement (§7).
#
# Generate genesis block and channel tx:
#   export FABRIC_CFG_PATH=./
#   configtxgen -profile TetaGuardGenesis -channelID system-channel \
#               -outputBlock ./channel-artifacts/genesis.block
#   configtxgen -profile TetaChannel -channelID teta-channel \
#               -outputCreateChannelTx ./channel-artifacts/teta-channel.tx

Organizations:
  - &OrdererOrg
    Name: OrdererMSP
    ID: OrdererMSP
    MSPDir: ./crypto-config/ordererOrganizations/orderer.tetaguard.net/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererMSP.admin')"

  - &TetaGuardOrg
    Name: TetaGuardMSP
    ID: TetaGuardMSP
    MSPDir: ./crypto-config/peerOrganizations/tetaguard.net/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('TetaGuardMSP.admin', 'TetaGuardMSP.peer', 'TetaGuardMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('TetaGuardMSP.admin', 'TetaGuardMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('TetaGuardMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('TetaGuardMSP.peer')"
    AnchorPeers:
      - Host: peer0.rsu1.tetaguard.net
        Port: 7051

Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V2_5: true

Application: &ApplicationDefaults
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Endorsement:
      # PBFT equivalent: ⌊(5-1)/3⌋ = 1 Byzantine fault tolerance
      # MAJORITY of 5 RSU peers = 3 endorsements required
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
  Capabilities:
    <<: *ApplicationCapabilities

Orderer: &OrdererDefaults
  # BFT (SmartBFT) for PBFT tolerance — requires Fabric 3.0+
  # For Fabric 2.x: change to OrdererType: etcdraft
  OrdererType: BFT
  Addresses:
    - orderer.tetaguard.net:7050
  # C-1 FIX: BatchTimeout reduced from 50ms to 20ms.
  # Reasoning: worst-case commit path is BatchTimeout + PBFT latency + block delivery.
  # At 50ms batch wait, worst case exceeded 100ms beacon budget under real wireless RTT.
  # At 20ms, budget remaining for PBFT (3 round-trips ≈ 3ms LAN / ~15ms wireless) and
  # block propagation still fits within 100ms.  See §3.4.10 latency analysis.
  BatchTimeout: 20ms
  BatchSize:
    # Reduced from 100: with 5 RSUs each submitting 1 beacon per 100ms interval,
    # max expected throughput is ~50 tx/block.  Smaller preferred size = faster commit.
    MaxMessageCount: 50
    AbsoluteMaxBytes: 10 MB
    PreferredMaxBytes: 512 KB
  BFTMetadata:
    ConsensusMetadata: ""
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"
  Capabilities:
    <<: *OrdererCapabilities

Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ChannelCapabilities

Profiles:
  TetaGuardGenesis:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererOrg
    Consortiums:
      TetaConsortium:
        Organizations:
          - *TetaGuardOrg

  TetaChannel:
    Consortium: TetaConsortium
    <<: *ChannelDefaults
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *TetaGuardOrg
      Capabilities:
        <<: *ApplicationCapabilities
