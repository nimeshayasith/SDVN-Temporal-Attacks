      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.rsu1.tetaguard.net:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.rsu2.tetaguard.net:7052
      CORE_PEER_LOCALMSPID: TetaGuardMSP
