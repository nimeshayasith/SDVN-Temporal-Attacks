      CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/fabric/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/fabric/tls/ca.crt
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb.rsu2:5984
      CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME: admin
      CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD: adminpw
    depends_on:
      - couchdb.rsu2
    volumes:
      - /var/run/:/host/var/run/
      - ./crypto-config/peerOrganizations/tetaguard.net/peers/peer0.rsu2.tetaguard.net/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/tetaguard.net/peers/peer0.rsu2.tetaguard.net/tls:/etc/hyperledger/fabric/tls
      - peer0.rsu2.tetaguard.net:/var/hyperledger/production
    ports:
      - "7052:7052"
    networks:
      - teta-net

