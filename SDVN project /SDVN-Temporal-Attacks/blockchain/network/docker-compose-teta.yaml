# docker-compose-teta.yaml — TETA-Guard Hyperledger Fabric 3.1 network
#
# Fabric 3.1 with SmartBFT (Byzantine Fault Tolerant) orderer (§7).
# 4 orderer nodes provide f=1 BFT fault tolerance (3f+1=4).
#
# Components:
#   orderer1..4.tetaguard.net      — SmartBFT orderer cluster (BFT, §7)
#   peer0.rsu1..5.tetaguard.net    — 5 RSU Fabric peers (RSU mode, N_RSUs > 0)
#   peer0.obu1..3.tetaguard.net    — 3 OBU Fabric peers (OBU mode, N_RSUs = 0)
#   couchdb.rsu1..5 / obu1..3     — CouchDB for rich queries (§15 dependency)
#   ca.tetaguard.net               — Fabric CA for MSP
#
# Start RSU mode (N_RSUs > 0):
#   docker-compose -f docker-compose-teta.yaml up -d \
#     orderer1.tetaguard.net orderer2.tetaguard.net \
#     orderer3.tetaguard.net orderer4.tetaguard.net \
#     ca.tetaguard.net \
#     peer0.rsu1.tetaguard.net peer0.rsu2.tetaguard.net peer0.rsu3.tetaguard.net \
#     peer0.rsu4.tetaguard.net peer0.rsu5.tetaguard.net
#
# Stop and clean volumes:
#   docker-compose -f docker-compose-teta.yaml down -v

version: '3.7'

networks:
  teta-net:
    name: teta_network

volumes:
  orderer1.tetaguard.net:
  orderer2.tetaguard.net:
  orderer3.tetaguard.net:
  orderer4.tetaguard.net:
  peer0.rsu1.tetaguard.net:
  peer0.rsu2.tetaguard.net:
  peer0.rsu3.tetaguard.net:
  peer0.rsu4.tetaguard.net:
  peer0.rsu5.tetaguard.net:
  peer0.obu1.tetaguard.net:
  peer0.obu2.tetaguard.net:
  peer0.obu3.tetaguard.net:
  couchdb.rsu1:
  couchdb.rsu2:
  couchdb.rsu3:
  couchdb.rsu4:
  couchdb.rsu5:
  couchdb.obu1:
  couchdb.obu2:
  couchdb.obu3:

# ─── Shared env template for all 4 SmartBFT orderers ─────────────────────────
x-orderer-env: &orderer-env
  FABRIC_LOGGING_SPEC: INFO
  ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
  ORDERER_GENERAL_LOCALMSPID: OrdererMSP
  ORDERER_GENERAL_TLS_ENABLED: "true"
  # Fabric 3.x: bootstrapmethod=none — channels are joined via osnadmin, not genesis file.
  ORDERER_GENERAL_BOOTSTRAPMETHOD: none
  # Channel Participation API — required for Fabric 3.x SmartBFT.
  # Orderers join channels via: osnadmin channel join --config-block ...
  ORDERER_CHANNELPARTICIPATION_ENABLED: "true"
  ORDERER_ADMIN_TLS_ENABLED: "true"

# ─── Shared env template for all Fabric peers ─────────────────────────────────
x-peer-env: &peer-env
  CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
  CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: teta_network
  FABRIC_LOGGING_SPEC: INFO
  CORE_PEER_TLS_ENABLED: "true"
  CORE_PEER_GOSSIP_USELEADERELECTION: "true"
  CORE_PEER_GOSSIP_ORGLEADER: "false"
  CORE_PEER_PROFILE_ENABLED: "false"
  CORE_CHAINCODE_EXECUTETIMEOUT: 300s
  CORE_LEDGER_STATE_STATEDATABASE: CouchDB
  TETA_SIMULATION_MODE: "1"
  CORE_CHAINCODE_ENV_WHITELIST: "TETA_SIMULATION_MODE"
  # teta-ccenv bundles liboqs so the chaincode's real ML-DSA-87 verifier
  # (verification_liboqs.go, the default build) links successfully — the
  # stock fabric-ccenv image has no liboqs installed. See
  # chaincode/temporalecho/Dockerfile.ccenv.
  CORE_CHAINCODE_BUILDER: teta-ccenv:latest

services:
  # ─── Fabric CA ──────────────────────────────────────────────────────────────
  ca.tetaguard.net:
    image: hyperledger/fabric-ca:1.5
    environment:
      FABRIC_CA_HOME: /etc/hyperledger/fabric-ca-server
      FABRIC_CA_SERVER_CA_NAME: ca.tetaguard.net
      FABRIC_CA_SERVER_TLS_ENABLED: "true"
      FABRIC_CA_SERVER_PORT: 7054
    ports:
      - "7054:7054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ./crypto-config/peerOrganizations/tetaguard.net/ca/:/etc/hyperledger/fabric-ca-server-config
    container_name: ca.tetaguard.net
    networks:
      - teta-net

  # ─── SmartBFT Orderer 1 (leader candidate) ───────────────────────────────────
  orderer1.tetaguard.net:
    image: hyperledger/fabric-orderer:3.1
    environment:
      <<: *orderer-env
      ORDERER_GENERAL_LISTENPORT: 7050
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
      ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_CLUSTER_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      # Admin TLS (osnadmin API on port 9443)
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:9443
      ORDERER_ADMIN_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_ADMIN_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_ADMIN_TLS_CLIENTROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    volumes:
      - ./crypto-config/ordererOrganizations/orderer.tetaguard.net/orderers/orderer1.tetaguard.net/msp:/var/hyperledger/orderer/msp
      - ./crypto-config/ordererOrganizations/orderer.tetaguard.net/orderers/orderer1.tetaguard.net/tls:/var/hyperledger/orderer/tls
      - orderer1.tetaguard.net:/var/hyperledger/production/orderer
    ports:
      - "7050:7050"
      - "9443:9443"
    container_name: orderer1.tetaguard.net
    networks:
      - teta-net

  # ─── SmartBFT Orderer 2 ──────────────────────────────────────────────────────
  orderer2.tetaguard.net:
    image: hyperledger/fabric-orderer:3.1
    environment:
      <<: *orderer-env
      ORDERER_GENERAL_LISTENPORT: 7150
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
      ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_CLUSTER_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:9543
      ORDERER_ADMIN_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_ADMIN_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_ADMIN_TLS_CLIENTROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    volumes:
      - ./crypto-config/ordererOrganizations/orderer.tetaguard.net/orderers/orderer2.tetaguard.net/msp:/var/hyperledger/orderer/msp
      - ./crypto-config/ordererOrganizations/orderer.tetaguard.net/orderers/orderer2.tetaguard.net/tls:/var/hyperledger/orderer/tls
      - orderer2.tetaguard.net:/var/hyperledger/production/orderer
    ports:
      - "7150:7150"
      - "9543:9543"
    container_name: orderer2.tetaguard.net
    networks:
      - teta-net

  # ─── SmartBFT Orderer 3 ──────────────────────────────────────────────────────
  orderer3.tetaguard.net:
    image: hyperledger/fabric-orderer:3.1
    environment:
      <<: *orderer-env
      ORDERER_GENERAL_LISTENPORT: 7250
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
      ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_CLUSTER_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:9643
      ORDERER_ADMIN_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_ADMIN_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_ADMIN_TLS_CLIENTROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    volumes:
      - ./crypto-config/ordererOrganizations/orderer.tetaguard.net/orderers/orderer3.tetaguard.net/msp:/var/hyperledger/orderer/msp
      - ./crypto-config/ordererOrganizations/orderer.tetaguard.net/orderers/orderer3.tetaguard.net/tls:/var/hyperledger/orderer/tls
      - orderer3.tetaguard.net:/var/hyperledger/production/orderer
    ports:
