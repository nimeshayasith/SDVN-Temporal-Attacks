  # ══════════════════════════════════════════════════════════════════════════
  # OBU PEERS — used when N_RSUs = 0 (no fixed RSU infrastructure)
  # ══════════════════════════════════════════════════════════════════════════

  couchdb.obu1:
    image: couchdb:3.3.3
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: adminpw
