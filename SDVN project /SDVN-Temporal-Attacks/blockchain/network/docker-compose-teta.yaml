      - "9643:9643"
    container_name: orderer3.tetaguard.net
    networks:
      - teta-net

  # ─── SmartBFT Orderer 4 ──────────────────────────────────────────────────────
  orderer4.tetaguard.net:
    image: hyperledger/fabric-orderer:3.1
    environment:
      <<: *orderer-env
      ORDERER_GENERAL_LISTENPORT: 7350
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
      ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_CLUSTER_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:9743
      ORDERER_ADMIN_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_ADMIN_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_ADMIN_TLS_CLIENTROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    volumes:
      - ./crypto-config/ordererOrganizations/orderer.tetaguard.net/orderers/orderer4.tetaguard.net/msp:/var/hyperledger/orderer/msp
      - ./crypto-config/ordererOrganizations/orderer.tetaguard.net/orderers/orderer4.tetaguard.net/tls:/var/hyperledger/orderer/tls
      - orderer4.tetaguard.net:/var/hyperledger/production/orderer
    ports:
      - "7350:7350"
      - "9743:9743"
    container_name: orderer4.tetaguard.net
    networks:
      - teta-net

  # ─── CouchDB instances (one per RSU peer) ─────────────────────────────────────
  couchdb.rsu1:
    image: couchdb:3.3.3
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: adminpw
    ports:
      - "5984:5984"
    volumes:
      - couchdb.rsu1:/opt/couchdb/data
    networks:
      - teta-net

  couchdb.rsu2:
    image: couchdb:3.3.3
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: adminpw
    ports:
      - "5985:5984"
    volumes:
      - couchdb.rsu2:/opt/couchdb/data
    networks:
      - teta-net

  couchdb.rsu3:
    image: couchdb:3.3.3
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: adminpw
    ports:
      - "5986:5984"
    volumes:
      - couchdb.rsu3:/opt/couchdb/data
    networks:
      - teta-net

  couchdb.rsu4:
    image: couchdb:3.3.3
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: adminpw
    ports:
      - "5987:5984"
    volumes:
      - couchdb.rsu4:/opt/couchdb/data
    networks:
      - teta-net

  couchdb.rsu5:
    image: couchdb:3.3.3
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: adminpw
    ports:
      - "5988:5984"
    volumes:
      - couchdb.rsu5:/opt/couchdb/data
    networks:
      - teta-net

  # ─── Peer: peer0.rsu1 ────────────────────────────────────────────────────────
  peer0.rsu1.tetaguard.net:
    image: hyperledger/fabric-peer:3.1
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.rsu1.tetaguard.net
      CORE_PEER_ADDRESS: peer0.rsu1.tetaguard.net:7051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.rsu1.tetaguard.net:7052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.rsu2.tetaguard.net:7052
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.rsu1.tetaguard.net:7051
      CORE_PEER_LOCALMSPID: TetaGuardMSP
      CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/fabric/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/fabric/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/fabric/tls/ca.crt
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb.rsu1:5984
      CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME: admin
      CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD: adminpw
    depends_on:
      - couchdb.rsu1
    volumes:
      - /var/run/:/host/var/run/
      - ./crypto-config/peerOrganizations/tetaguard.net/peers/peer0.rsu1.tetaguard.net/msp:/etc/hyperledger/fabric/msp
