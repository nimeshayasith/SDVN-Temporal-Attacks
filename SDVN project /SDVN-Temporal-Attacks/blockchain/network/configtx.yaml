# configtx.yaml — Fabric channel and endorsement policy for TETA-Guard
#
# SmartBFT ordering (Fabric 3.x, §7): OrdererType: BFT with 4 ordering nodes.
# The ordering-layer node count is an infrastructure choice, not derived from
# the PDF's f=2 formula: f = floor((Peertotal-1)/3) governs Byzantine fault
# tolerance among the 8 application/endorsing peers (5 RSU + 3 OBU), via
# FaultToleranceF=2 in trust.go, not the SmartBFT orderer cluster size
# (clarified 2026-07-29).
# Endorsement policy (peer layer): MAJORITY of the 8-peer TetaGuardOrg
# consortium (5 RSU + 3 OBU) = 5-of-8 endorsements, tolerating f =
# ⌊(8-1)/3⌋ = 2 Byzantine peers, matching FaultToleranceF in trust.go.
#
# Requires Fabric 3.1 binaries:
#   curl -sSL https://bit.ly/2ysbOFE | bash -s -- 3.1.0
#
# Generate channel genesis block (Fabric 3.x — no system channel):
#   export FABRIC_CFG_PATH=./
#   configtxgen -profile TetaChannel -channelID teta-channel \
#               -outputBlock ./channel-artifacts/teta-channel.block
#
# Join orderers (via osnadmin, see create_channel.sh):
#   osnadmin channel join --channelID teta-channel \
#     --config-block ./channel-artifacts/teta-channel.block \
#     -o orderer1.tetaguard.net:9443 \
#     --ca-file ./crypto-config/ordererOrganizations/orderer.tetaguard.net/tlsca/tlsca.orderer.tetaguard.net-cert.pem \
#     --client-cert ./crypto-config/ordererOrganizations/orderer.tetaguard.net/users/Admin@orderer.tetaguard.net/tls/client.crt \
#     --client-key  ./crypto-config/ordererOrganizations/orderer.tetaguard.net/users/Admin@orderer.tetaguard.net/tls/client.key

Organizations:
  - &OrdererOrg
    Name: OrdererMSP
    ID: OrdererMSP
    MSPDir: ./crypto-config/ordererOrganizations/orderer.tetaguard.net/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererMSP.admin')"
    OrdererEndpoints:
      - orderer1.tetaguard.net:7050
      - orderer2.tetaguard.net:7150
      - orderer3.tetaguard.net:7250
      - orderer4.tetaguard.net:7350

  - &TetaGuardOrg
    Name: TetaGuardMSP
    ID: TetaGuardMSP
    MSPDir: ./crypto-config/peerOrganizations/tetaguard.net/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('TetaGuardMSP.admin', 'TetaGuardMSP.peer', 'TetaGuardMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('TetaGuardMSP.admin', 'TetaGuardMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('TetaGuardMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('TetaGuardMSP.peer')"
    AnchorPeers:
      # Changed from peer0.rsu1 (7051): confirmed stuck at block height 1
      # despite its container running — a pre-existing environment issue
      # (deploy_chaincode.sh's own comments already document RSU1 as
      # unreliable for gossip/network operations here). Any peer bootstrapping
      # via anchor-peer discovery inherited that stuck state — this blocked
      # newly-joined OBU peers (whose gossip bootstrap list only contains
      # each other, so anchor discovery is their only path to the RSU peers)
      # from ever syncing past genesis. rsu3 is the peer already used
      # throughout this deployment's scripts as the confirmed-reliable one.
      - Host: peer0.rsu3.tetaguard.net
        Port: 7053

Capabilities:
  Channel: &ChannelCapabilities
    # V3_0 enables SmartBFT ordering service support (Fabric 3.x requirement).
    V3_0: true
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V2_5: true

Application: &ApplicationDefaults
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Endorsement:
      # PBFT equivalent at peer layer: ⌊(5-1)/3⌋ = 1 Byzantine fault tolerance.
      # MAJORITY of 5 RSU peers = 3 endorsements required.
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
  Capabilities:
    <<: *ApplicationCapabilities

Orderer: &OrdererDefaults
  # SmartBFT (Byzantine Fault Tolerant) ordering — Fabric 3.x §7.
  # 4 orderer nodes satisfy 3f+1 = 4 for f=1 Byzantine fault tolerance at the
  # ordering layer. This node count is an infrastructure choice independent
  # of the PDF's f=2, which governs the 8-peer application/endorsement
  # layer (see FaultToleranceF in trust.go) — clarified 2026-07-29.
  # This replaces the etcdraft (crash-fault-tolerant) orderer used in Fabric 2.x.
  OrdererType: BFT
  # Global Addresses removed: Fabric 3.0's V3_0 channel capability (enabled
  # below) rejects a global Orderer.Addresses list — orderer endpoints must
  # be declared per-organization only, via OrdererEndpoints under &OrdererOrg
  # (already present above, lines 39-43). Configtxgen error without this fix:
  # "global orderer endpoints exist, but can not be used with V3_0 capability".
  # C-1: BatchTimeout 20ms — worst-case commit path (BFT latency + block delivery)
  # still fits within the 100ms beacon budget. See §3.4.10 latency analysis.
  BatchTimeout: 20ms
  BatchSize:
    MaxMessageCount: 50
    AbsoluteMaxBytes: 10 MB
    PreferredMaxBytes: 512 KB
  SmartBFT:
    # SmartBFT consensus parameters (§7, Algorithm 4 ordering layer).
    RequestBatchMaxCount:      50
    RequestBatchMaxInterval:   20ms
    # Fix (2026-07-29, real T_exec_fabric measurement debugging): the
    # ORIGINAL RequestForwardTimeout=2s / RequestComplainTimeout=20s values
    # were the dominant cost in every measured Fabric commit latency
    # (10-20s observed per transaction), NOT the actual BFT consensus round
    # itself -- live orderer log tracing (docker logs -f on all orderers
    # during a real transaction) confirmed the entire
    # processProposal->processPrepares->processCommits->decide->Deliver
    # sequence completes in under 20ms once a non-leader orderer actually
    # forwards the client's request to the leader; the multi-second delay
    # was purely a non-leader orderer sitting on the request before its own
    # OnRequestTimeout handler fired (observed baseline ~10s matched ~5
    # internal retries at the old 2s forward timeout). Reduced by roughly 2
    # orders of magnitude, still far above the <20ms observed real
    # consensus cost, so this remains a safe/generous margin.
    RequestForwardTimeout:     200ms
    RequestComplainTimeout:    3s
    RequestAutoRemoveTimeout:  3m0s
    ViewChangeResendInterval:  5s
    ViewChangeTimeout:         20s
    LeaderHeartbeatTimeout:    1m0s
    CollectTimeout:            1s
    RequestBatchMaxBytes:      10485760
    IncomingMessageBufferSize: 200
    RequestPoolSize:           100000
    LeaderHeartbeatCount:      10
  # ConsenterMapping: one entry per ordering node (4 total for f=1 BFT).
  # Identity = MSP signing cert (used for BFT message signing).
  # TLS certs = used to authenticate cluster-internal consensus messages.
  ConsenterMapping:
    - ID: 1
      Host: orderer1.tetaguard.net
      Port: 7050
      MSPID: OrdererMSP
      Identity: ./crypto-config/ordererOrganizations/orderer.tetaguard.net/orderers/orderer1.tetaguard.net/msp/signcerts/orderer1.tetaguard.net-cert.pem
      ClientTLSCert: ./crypto-config/ordererOrganizations/orderer.tetaguard.net/orderers/orderer1.tetaguard.net/tls/server.crt
      ServerTLSCert: ./crypto-config/ordererOrganizations/orderer.tetaguard.net/orderers/orderer1.tetaguard.net/tls/server.crt
    - ID: 2
      Host: orderer2.tetaguard.net
      Port: 7150
      MSPID: OrdererMSP
      Identity: ./crypto-config/ordererOrganizations/orderer.tetaguard.net/orderers/orderer2.tetaguard.net/msp/signcerts/orderer2.tetaguard.net-cert.pem
      ClientTLSCert: ./crypto-config/ordererOrganizations/orderer.tetaguard.net/orderers/orderer2.tetaguard.net/tls/server.crt
      ServerTLSCert: ./crypto-config/ordererOrganizations/orderer.tetaguard.net/orderers/orderer2.tetaguard.net/tls/server.crt
    - ID: 3
      Host: orderer3.tetaguard.net
      Port: 7250
      MSPID: OrdererMSP
      Identity: ./crypto-config/ordererOrganizations/orderer.tetaguard.net/orderers/orderer3.tetaguard.net/msp/signcerts/orderer3.tetaguard.net-cert.pem
      ClientTLSCert: ./crypto-config/ordererOrganizations/orderer.tetaguard.net/orderers/orderer3.tetaguard.net/tls/server.crt
      ServerTLSCert: ./crypto-config/ordererOrganizations/orderer.tetaguard.net/orderers/orderer3.tetaguard.net/tls/server.crt
    - ID: 4
      Host: orderer4.tetaguard.net
      Port: 7350
      MSPID: OrdererMSP
      Identity: ./crypto-config/ordererOrganizations/orderer.tetaguard.net/orderers/orderer4.tetaguard.net/msp/signcerts/orderer4.tetaguard.net-cert.pem
      ClientTLSCert: ./crypto-config/ordererOrganizations/orderer.tetaguard.net/orderers/orderer4.tetaguard.net/tls/server.crt
      ServerTLSCert: ./crypto-config/ordererOrganizations/orderer.tetaguard.net/orderers/orderer4.tetaguard.net/tls/server.crt
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"
  Capabilities:
    <<: *OrdererCapabilities

Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ChannelCapabilities

Profiles:
  # TetaChannel: application channel genesis block (Fabric 3.x — no system channel).
  # Orderers join via osnadmin channel join; peers join via peer channel join.
  TetaChannel:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererOrg
      Capabilities:
        <<: *OrdererCapabilities
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *TetaGuardOrg
      Capabilities:
        <<: *ApplicationCapabilities
    # Consortiums block removed: Fabric 3.x has no system channel, so an
    # application channel profile must not declare Consortiums — orderers
    # reject the join with "invalid config: contains consortiums: system
    # channel not supported" if it's present. configtxgen already warned
    # about this ("'Consortiums' should be nil") when the block generated
    # successfully but silently included it anyway.

  # TetaChannelNoRSU: second application channel, same org/orderers as
  # TetaChannel, but with its own independent ledger. Used exclusively to
  # bootstrap all 8 peers (rsu1-5 + obu1-3) as Tier-2 OBU (RegisterOBUPeer,
  # tau0=0.10) for no-RSU scenario testing (np=8, Eq. 3.40-3.41), without
  # touching TetaChannel's existing Tier-1 RSU trust records. See
  # blockchain/NORSU_CHANNEL_PLAN.md.
  TetaChannelNoRSU:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererOrg
      Capabilities:
        <<: *OrdererCapabilities
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *TetaGuardOrg
      Capabilities:
        <<: *ApplicationCapabilities
